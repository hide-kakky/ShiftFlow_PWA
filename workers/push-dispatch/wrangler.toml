name = "shiftflow-push-dispatch"
main = "src/index.js"
compatibility_date = "2025-11-02"
workers_dev = false

[vars]
WEB_PUSH_ENABLED = "false"

[[d1_databases]]
binding = "DB"
database_name = "app_d1_dev"
database_id = "6ed349e4-06e1-4eab-b850-b2b99450bfda"

[env.production.vars]
WEB_PUSH_ENABLED = "true"

[[env.production.d1_databases]]
binding = "DB"
database_name = "app_d1_prod"
database_id = "2a9b6101-3c1c-400a-bd3d-f19a8e8d103e"

[env.production.triggers]
crons = ["* * * * *"]

[observability]
enabled = true

[observability.traces]
enabled = true
